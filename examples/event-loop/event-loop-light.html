iv><div class="u-cc"><p class="u-at" data-at="0">Four lines print <b>A D C B</b>, not A B C D. Each callback waits in a queue until the event loop runs it.</p><p class="u-at" data-at="1">The loop takes the first task, the whole <b data-hue="ink">script</b>, and runs it on the call stack. Line 1 runs at once and prints A.</p><p class="u-at" data-at="2">setTimeout sends its callback to the <b data-hue="gold">task queue</b> through a timer, and .then sends its callback to the <b data-hue="blue">microtask queue</b>. Neither runs while the script is on the stack.</p><p class="u-at" data-at="3">When the script ends, the loop runs every <b data-hue="blue">microtask</b> before it takes another task. That is why C prints before B.</p><p class="u-at" data-at="4">Only now does the loop take the next task, the <b data-hue="gold">timer callback</b>, and B prints. A 0 ms timer still waits for the script and for every microtask.</p></div><nav class="u-steps" aria-label="Scenes"><button type="button" class="u-play" aria-pressed="false"><span>▶</span>Play</button><button type="button" class="u-voice" aria-pressed="true" hidden><span>♪</span>Voice</button><button type="button" data-go="0" aria-current="step"><span>1</span>Overview</button><button type="button" data-go="1"><span>2</span>Run script</button><button type="button" data-go="2"><span>3</span>Queue callbacks</button><button type="button" data-go="3"><span>4</span>Drain microtasks</button><button type="button" data-go="4"><span>5</span>Next task</button></nav><div class="u-key"><span data-hue="ink"><i></i>the script (first task)</span><span data-hue="gold"><i></i>timer callback (task)</span><span data-hue="blue"><i></i>promise callback (microtask)</span></div></div></div><figcaption class="iso-legend"><span class="iso-caption">A browser-style event loop on four lines of JavaScript. Every frame, queue entry and timeline bar comes from a small simulator of the loop. The time axis counts steps of the simulation, not milliseconds. Rendering between tasks is left out.</span></figcaption></figure></main><script type="module">function showSpans(root, t) {
  const box = root.querySelector(".u-lanes");
  const px = Number(box.dataset.px);
  box.querySelector(".u-now").style.transform = `translateX(${(t - Number(box.dataset.from)) * px}px)`;
  root.querySelectorAll(".u-span").forEach((el) => {
    const from = Number(el.dataset.from);
    const to = Number(el.dataset.to);
    const v = Math.max(0, Math.min(1, (t - from) / (to - from)));
    el.style.setProperty("--v", v.toFixed(3));
    el.toggleAttribute("data-labeled", v * (to - from) * px >= Number(el.dataset.need));
  });
}
