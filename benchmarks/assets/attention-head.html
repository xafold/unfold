><text class="u-bar-value" x="15" y="85.2">0.24</text><text class="u-bar-label" x="15" y="132">the</text></g><g class="u-bar" data-i="1" transform="translate(30 0)" style="--v:0.670;--c:1"><rect class="u-bar-fill" x="4" y="0" width="22" height="120"/><text class="u-bar-value" x="15" y="33.599999999999994">0.67</text><text class="u-bar-label" x="15" y="132">cat</text></g><g class="u-bar" data-i="2" transform="translate(60 0)" style="--v:0.090;--c:2"><rect class="u-bar-fill" x="4" y="0" width="22" height="120"/><text class="u-bar-value" x="15" y="103.2">0.09</text><text class="u-bar-label" x="15" y="132">sat</text></g><g class="u-bar" data-i="3" transform="translate(90 0)" style="--v:0.000;--c:3"><rect class="u-bar-fill" x="4" y="0" width="22" height="120"/><text class="u-bar-value" x="15" y="114">0.00</text><text class="u-bar-label" x="15" y="132">on</text></g><g class="u-bar" data-i="4" transform="translate(120 0)" style="--v:0.000;--c:4"><rect class="u-bar-fill" x="4" y="0" width="22" height="120"/><text class="u-bar-value" x="15" y="114">0.00</text><text class="u-bar-label" x="15" y="132">the</text></g><g class="u-bar" data-i="5" transform="translate(150 0)" style="--v:0.000;--c:5"><rect class="u-bar-fill" x="4" y="0" width="22" height="120"/><text class="u-bar-value" x="15" y="114">0.00</text><text class="u-bar-label" x="15" y="132">mat</text></g></g></g></svg><div class="u-controls"><div class="u-ctl" data-scenes="1 2 3 4 5"><label>x <span data-xtok>“sat”</span></label><input type="number" min="-1" max="1" step="0.1" data-k="0" aria-label="Value 1 of the picked token's row of X"><input type="number" min="-1" max="1" step="0.1" data-k="1" aria-label="Value 2 of the picked token's row of X"><input type="number" min="-1" max="1" step="0.1" data-k="2" aria-label="Value 3 of the picked token's row of X"><input type="number" min="-1" max="1" step="0.1" data-k="3" aria-label="Value 4 of the picked token's row of X"><button type="button" data-reset>model X</button></div></div><div class="u-say" aria-live="polite"><p class="u-at" data-at="0">One attention head gives each of 6 tokens a new vector. The new vector mixes in the tokens before it.</p><p class="u-at" data-at="1">Each token becomes a row of 4 numbers: its embedding plus its position. The position is why the two <b>the</b> rows of <b data-hue="ink">X</b> differ.</p><p class="u-at" data-at="2">Three learned matrices turn each row of X into a <b data-hue="blue">query</b>, a <b data-hue="yellow">key</b> and a <b data-hue="red">value</b>. These say what a token looks for, offers and passes on.</p><p class="u-at" data-at="3">Each score is the dot product of a query and a <b data-hue="yellow">key</b>, divided by √3. A token can only look back, so cells above the diagonal are −∞.</p><p class="u-at" data-at="4">Softmax turns each row of scores into <b data-hue="green">weights</b> that are positive and add up to 1. A masked score gets weight 0.</p><p class="u-at" data-at="5">The output for a token is a weighted sum of the <b data-hue="red">value</b> rows. The sum is one row of <b data-hue="teal">O</b>.</p></div><nav class="u-steps" aria-label="Scenes"><button type="button" class="u-play" aria-pressed="false"><span>▶</span>Play</button><button type="button" data-go="0" aria-current="step"><span>1</span>Overview</button><button type="button" data-go="1"><span>2</span>Embed</button><button type="button" data-go="2"><span>3</span>Project</button><button type="button" data-go="3"><span>4</span>Score</button><button type="button" data-go="4"><span>5</span>Softmax</button><button type="button" data-go="5"><span>6</span>Mix</button></nav><div class="u-key"><span data-hue="ink"><i></i>X input</span><span data-hue="blue"><i></i>Q query</span><span data-hue="yellow"><i></i>K key</span><span data-hue="red"><i></i>V value</span><span data-hue="purple"><i></i>S score</span><span data-hue="green"><i></i>A weight</span><span data-hue="teal"><i></i>O output</span><span><i class="u-solid"></i>positive</span><span><i class="u-hollow"></i>negative</span></div></div></div><figcaption class="iso-legend"><span class="iso-caption">A causal self-attention head with d_model = 4 and d_k = 3. The weights are small and set by hand so the pattern is easy to read. Every other number is computed from them, and the printed values add up by hand. The number fields change the picked token's row of X. The page then runs the same code as the model again.</span></figcaption></figure></main><script type="module">function cellLook(value, max) {
  const masked = value === -Infinity;
  const s = masked ? 0 : Math.min(1, Math.abs(value) / max);
  return { masked, neg: !masked && value < 0, hot: !masked && value > 0 && s > 0.55, alpha: 0.1 + 0.8 * s };
}
function fmt(value, places = 1) {

  return Number(text) === 0 ? (0).toFixed(places) : text.replace("-", "−");
}

    const look = cellLook(value, max);
    cell.toggleAttribute("data-masked", look.masked);
    cell.toggleAttribute("data-neg", look.neg);
    cell.toggleAttribute("data-hot", look.hot);

function showSpans(root, t) {

  // beat(scene, ms, fn, wait): call fn(0), fn(1), … every ms while that scene shows, starting `wait` ms after it opens.
  // Under reduced motion fn(-1) is called once instead: show the resting state.
  const beat = (sceneIndex, ms, fn, wait = 1000) => beats.push({ scene: sceneIndex, ms, fn, wait, n: 0, at: performance.now() + wait - ms });
  // pause(): the user took control. The tour stops, and the sweeps hold until the scene changes.
  const pause = () => {
    setPlaying(false);
    held = true;
  };
  return { stage, go, beat, pause, scene: () => scene, onTime: (fn) => (onTime = fn), timeAt, narrow: () => stage.hasAttribute("data-narrow") };
}
const UNFOLD = runtime();

const W_Q = [[0.2,0.4,0.6],[2,-0.3,0.4],[-0.4,1.4,0.2],[0.6,-0.2,1.5]];
const W_K = [[2,0.1,0.5],[-0.2,0.3,1.1],[0,1,-0.4],[-0.3,-0.5,0.9]];
const W_V = [[0.9,0,-0.3],[-0.2,1,0.1],[0.1,-0.4,0.8],[0.3,0.6,0.6]];
const SCALE = 1.7320508075688772;
const X0 = [[0.2,-0.3,0.9,0],[0.9,0.1,-0.2,0.3],[-0.2,0.9,0.1,-0.3],[0,-0.2,0.3,0.9],[0.3,-0.3,0.8,0.2],[0.8,-0.1,0,0.4]];
function matmul(a, b) { return a.map((row) => b[0].map((_, j) => row.reduce((sum, v, k) => sum + v * b[k][j], 0))); }
function transpose(m) { return m[0].map((_, j) => m.map((row) => row[j])); }
function round(m, places) { return m.map((row) => row.map((v) => (v === -Infinity ? v : Math.round(v * 10 ** places) / 10 ** places))); }
function masked(i, j) { return j > i; }
function softmax(row) {
  const top = Math.max(...row);
  const e = row.map((v) => (v === -Infinity ? 0 : Math.exp(v - top)));
  const total = e.reduce((a, b) => a + b, 0);
  return e.map((v) => v / total);
}
function head(X) {
  const Q = round(matmul(X, W_Q), 1);
  const K = round(matmul(X, W_K), 1);
  const V = round(matmul(X, W_V), 1);
  const S = round(matmul(Q, transpose(K)).map((row, i) => row.map((v, j) => (masked(i, j) ? -Infinity : v / SCALE))), 1);
  const A = round(S.map(softmax), 2);
  return { Q, K, V, S, A, O: round(matmul(A, V), 1) };
}

const M = { TOKENS: ["the","cat","sat","on","the","mat"], X: X0.map((row) => [...row]), ...head(X0) };
const root = UNFOLD.stage;
const readout = document.querySelector("[data-readout]");
const $ = (id) => root.querySelector("#" + id);
const tok = (i) => "\u201c" + M.TOKENS[i] + "\u201d";
const vec = (row, p = 1) => "[" + row.map((v) => fmt(v, p)).join(", ") + "]";
let query = 2;
let probe = null;
const contrib = (i) => M.V.map((row, j) => row.map((v) => Math.round(M.A[i][j] * v * 100) / 100));
const strongest = (i) => M.A[i].reduce((best, v, j) => (v > M.A[i][best] ? j : best), 0);
function say() {
  const s = UNFOLD.scene();
  const i = query;
  const j = strongest(i);
  let text = "";
  if (s === 0) text = "6 tokens \u00b7 d_model 4 \u00b7 d_k 3";
  if (s === 1) text = tok(i) + " \u2192 " + vec(M.X[i]);
  if (s === 2) text = "q" + " " + tok(i) + " = " + vec(M.Q[i]);
  if (s === 3) {
    const [a, b] = probe ?? scan ?? [i, j];
    text = b > a ? tok(a) + " cannot see " + tok(b) + " \u00b7 \u2212\u221e"
      : "q\u00b7k / \u221a3 = (" + M.Q[a].map((q, k) => fmt(q) + "\u00d7" + fmt(M.K[b][k])).join(" + ") + ") / 1.73 = " + fmt(M.S[a][b]);
  }
  if (s === 4) text = tok(i) + " gives " + fmt(M.A[i][j], 2) + " of its attention to " + tok(j);
  if (s === 5) text = "o " + tok(i) + " = " + vec(M.O[i]);
  if (readout.textContent !== text) readout.textContent = text;
}
const fields = [...root.querySelectorAll("[data-k]")];
let typing = null; // the field the reader is typing in: pick() leaves its text alone until "change"
function pick(i) {
  query = Math.max(0, Math.min(M.TOKENS.length - 1, i));
  root.querySelector("[data-xtok]").textContent = tok(query);
  fields.forEach((f) => f !== typing && (f.value = M.X[query][+f.dataset.k].toFixed(1)));
  for (const id of ["gX-grid", "gQ-grid", "gS-grid", "gA-grid", "gO-grid"]) mark($(id), query);
  mark($("gRows"), query, ".u-chip");
  mark($("gSumArrow"), query, ".u-sum-arrow");
  setBars($("bars"), M.A[query]);
  setGrid($("gC-grid"), contrib(query));
  const sum = [contrib(query).reduce((acc, row) => acc.map((v, k) => v + row[k]), [0, 0, 0]).map((v) => Math.round(v * 100) / 100)];
  setGrid($("gSum-grid"), sum);
  const top = Math.max(...M.A[query]);
  $("gV-grid").querySelectorAll(".u-cell").forEach((cell) => cell.style.setProperty("--w", (0.15 + 0.85 * M.A[query][+cell.dataset.r] / top).toFixed(2)));
  root.querySelectorAll(".u-weight").forEach((t) => {
    const w = M.A[query][+t.dataset.j];
    t.textContent = "\u00d7 " + fmt(w, 2);
    t.style.opacity = w > 0 ? 1 : 0.3;
  });
  say();
}
// Score scene: sweep the keys one at a time for the selected query, then hold on the result.
let scan = null;
const lightCells = (list) => {
  root.querySelectorAll("[data-hl]").forEach((el) => el.removeAttribute("data-hl"));
  list.forEach((el) => el && el.setAttribute("data-hl", ""));
};
UNFOLD.beat(3, 950, (n) => {
  const j = n < 0 ? -1 : n % (query + 2);
  scan = j >= 0 && j <= query ? [query, j] : null;
  lightCells(scan ? [...$("gK-grid").querySelectorAll('.u-cell[data-r="' + j + '"]'), $("gS-grid").querySelector('.u-cell[data-r="' + query + '"][data-c="' + j + '"]')] : []);
  say();
}, 1500);
root.addEventListener("unfold:scene", () => {
  scan = null;
  lightCells([]);
  say();
});
root.addEventListener("keydown", (e) => {
  const to = { ArrowUp: query - 1, ArrowDown: query + 1 }[e.key];
  if (to === undefined) return;
  e.preventDefault();
  UNFOLD.pause();
  pick(to);
});
root.addEventListener("click", (e) => {
  const chipEl = e.target.closest("#gRows .u-chip");
  const cell = e.target.closest(".u-cell");
  if (chipEl) pick(+chipEl.dataset.i);
  else if (cell && cell.closest("#gX,#gQ,#gS,#gA,#gO")) pick(+cell.dataset.r);
  else return;
  UNFOLD.pause();
});
root.addEventListener("pointerover", (e) => {
  const cell = e.target.closest("#gS .u-cell");
  probe = cell ? [+cell.dataset.r, +cell.dataset.c] : null;
  if (UNFOLD.scene() === 3) say();
});
// The reader's own X: same head(X) as the build, then every grid, block face and bar is redrawn.
const faceMax = (values) => Math.max(1e-9, ...values.flat().filter(Number.isFinite).map(Math.abs));
function recompute() {
  Object.assign(M, head(M.X));
  for (const k of ["X", "Q", "K", "V", "S", "A", "O"]) {
    setGrid($("g" + k + "-grid"), M[k]);
    const face = root.querySelector('[data-block="' + k + '"] .u-face');
    if (!face) continue;
    const values = M[k].flat();
    const top = faceMax(values);
    face.querySelectorAll("rect").forEach((rect, n) => {
      const look = cellLook(values[n], top);
      rect.toggleAttribute("data-masked", look.masked);
      rect.toggleAttribute("data-neg", look.neg);
      rect.style.setProperty("--a", look.alpha.toFixed(2));
    });
  }
  pick(query);
}
const ctl = root.querySelector(".u-ctl");
ctl.addEventListener("input", (e) => {
  const f = e.target.closest("[data-k]");
  const v = f && f.value !== "" ? Number(f.value) : NaN;
  if (!Number.isFinite(v)) return;
  UNFOLD.pause();
  M.X[query][+f.dataset.k] = Math.max(-1, Math.min(1, Math.round(v * 10) / 10));
  typing = f;
  recompute();
  typing = null;
});
ctl.addEventListener("change", () => pick(query));
ctl.querySelector("[data-reset]").addEventListener("click", () => {
  UNFOLD.pause();
  M.X = X0.map((row) => [...row]);
  recompute();
});
pick(query);
</script></body></html>
